name: Apply ad film poster patch

on:
  push:
    branches:
      - fix/adfilm-future-poster-frames

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adfilm-future-poster-frames
          fetch-depth: 0

      - name: Apply deterministic poster patch
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, oldLines, newLines) {
            const oldText = oldLines.join('\n');
            const newText = newLines.join('\n');
            const source = fs.readFileSync(file, 'utf8');
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error(`Missing expected block in ${file}: ${oldLines[0]}`);
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`Expected block is not unique in ${file}: ${oldLines[0]}`);
            fs.writeFileSync(file, source.slice(0, first) + newText + source.slice(first + oldText.length));
          }

          const finalize = 'api/ad-film/seedance/finalize-v2.js';
          replaceOnce(finalize,
            ['const PROCESSING_TTL_MS = 5 * 60 * 1000;'],
            ['const PROCESSING_TTL_MS = 5 * 60 * 1000;', 'const POSTER_FRAME_SECONDS = 0.12;']
          );
          replaceOnce(finalize,
            ['    videoUrl: source,', '    createdAt: generation.startedAt || project.updatedAt,'],
            ['    videoUrl: source,', '    posterUrl: clean(generation.posterUrl, 4000) || null,', '    createdAt: generation.startedAt || project.updatedAt,']
          );
          replaceOnce(finalize,
            ['        video_url: target.videoUrl,', '        logo_applied: Boolean(logoUrl),'],
            ['        video_url: target.videoUrl,', '        poster_url: target.posterUrl || null,', '        logo_applied: Boolean(logoUrl),']
          );
          replaceOnce(finalize,
            ['    const outputVideo = path.join(tmpDir, "final.mp4");', '    cleanup.push(outputVideo, musicFile, narrationFile, transparentLogo, originalLogo, avatarVideo, inputVideo, tmpDir);'],
            ['    const outputVideo = path.join(tmpDir, "final.mp4");', '    const posterFile = path.join(tmpDir, "poster.jpg");', '    cleanup.push(posterFile, outputVideo, musicFile, narrationFile, transparentLogo, originalLogo, avatarVideo, inputVideo, tmpDir);']
          );
          replaceOnce(finalize,
            ['    await runFfmpeg(args);', '', '    const key = `${mediaPrefix(user, projectId)}outputs/seedance/${safePart(outputId, "video")}-v${version}-final-v2-${Date.now()}.mp4`;'],
            ['    await runFfmpeg(args);', '', '    let posterReady = false;', '    try {', '      await runFfmpeg([', '        "-y", "-hide_banner", "-loglevel", "error",', '        "-ss", String(POSTER_FRAME_SECONDS),', '        "-i", outputVideo,', '        "-frames:v", "1",', '        "-q:v", "4",', '        posterFile,', '      ]);', '      posterReady = fs.existsSync(posterFile) && fs.statSync(posterFile).size > 0;', '    } catch (posterError) {', '      console.warn("[ad-film/seedance/finalize-v2/poster]", clean(posterError?.message || posterError, 600));', '    }', '', '    const key = `${mediaPrefix(user, projectId)}outputs/seedance/${safePart(outputId, "video")}-v${version}-final-v2-${Date.now()}.mp4`;']
          );
          replaceOnce(finalize,
            ['    } finally {', '      clearTimeout(uploadTimer);', '    }', '', '    const now = new Date().toISOString();'],
            ['    } finally {', '      clearTimeout(uploadTimer);', '    }', '', '    let posterUrl = "";', '    if (posterReady) {', '      const posterController = new AbortController();', '      const posterTimer = setTimeout(() => posterController.abort(), UPLOAD_TIMEOUT_MS);', '      try {', '        const posterStat = fs.statSync(posterFile);', '        posterUrl = await putObject({', '          key: `${mediaPrefix(user, projectId)}outputs/seedance/${safePart(outputId, "video")}-v${version}-poster-${Date.now()}.jpg`,', '          body: fs.createReadStream(posterFile),', '          contentLength: posterStat.size,', '          abortSignal: posterController.signal,', '          contentType: "image/jpeg",', '          cacheControl: "public, max-age=31536000, immutable",', '          contentDisposition: "inline",', '        });', '      } catch (posterUploadError) {', '        console.warn("[ad-film/seedance/finalize-v2/poster-upload]", clean(posterUploadError?.message || posterUploadError, 600));', '      } finally {', '        clearTimeout(posterTimer);', '      }', '    }', '', '    const now = new Date().toISOString();']
          );
          replaceOnce(finalize,
            ['      videoUrl: finalUrl,', '      logoUrl: logoUrl || null,'],
            ['      videoUrl: finalUrl,', '      posterUrl: posterUrl || null,', '      logoUrl: logoUrl || null,']
          );
          replaceOnce(finalize,
            ['        videoUrl: finalUrl,', '        logoUrl: logoUrl || null,'],
            ['        videoUrl: finalUrl,', '        posterUrl: posterUrl || null,', '        logoUrl: logoUrl || null,']
          );
          replaceOnce(finalize,
            ['      video_url: finalUrl,', '      source_video_url: sourceVideoUrl,'],
            ['      video_url: finalUrl,', '      poster_url: posterUrl || null,', '      source_video_url: sourceVideoUrl,']
          );

          const gallery = 'js/ad-film.output-gallery.js';
          replaceOnce(gallery,
            ['  if(window.__AIVO_AD_FILM_OUTPUT_GALLERY_V5__)return;', '  window.__AIVO_AD_FILM_OUTPUT_GALLERY_V5__=true;'],
            ['  if(window.__AIVO_AD_FILM_OUTPUT_GALLERY_V6__)return;', '  window.__AIVO_AD_FILM_OUTPUT_GALLERY_V6__=true;']
          );
          replaceOnce(gallery,
            ['        videoUrl:source.generation.videoUrl,', '        logoUrl:source.generation.logoUrl||source.media&&source.media.logo&&source.media.logo.url||null,'],
            ['        videoUrl:source.generation.videoUrl,', '        posterUrl:source.generation.posterUrl||null,', '        logoUrl:source.generation.logoUrl||source.media&&source.media.logo&&source.media.logo.url||null,']
          );
          replaceOnce(gallery,
            ['        clean(item.id),item.version||1,clean(item.videoUrl),clean(item.logoUrl),'],
            ['        clean(item.id),item.version||1,clean(item.videoUrl),clean(item.posterUrl),clean(item.logoUrl),']
          );
          replaceOnce(gallery,
            ['    video.src=item.videoUrl;', '    video.preload="metadata";'],
            ['    video.src=item.videoUrl;', '    if(clean(item.posterUrl))video.poster=item.posterUrl;', '    video.preload="metadata";']
          );
          replaceOnce(gallery,
            ['      window.AIVOAdFilmGeneratedVideo=item.videoUrl;', '      window.AIVOAdFilmGeneratedLogo=item.logoUrl||"";', '      window.AIVOAdFilmActiveOutputId=item.id;', '      if(window.AIVOAdFilmResultControls&&typeof window.AIVOAdFilmResultControls.mount==="function")window.AIVOAdFilmResultControls.mount(item.videoUrl,item.logoUrl||"",{projectId:source.id,outputId:item.id,version:item.version||1,play:!!play});'],
            ['      window.AIVOAdFilmGeneratedVideo=item.videoUrl;', '      window.AIVOAdFilmGeneratedPoster=item.posterUrl||"";', '      window.AIVOAdFilmGeneratedLogo=item.logoUrl||"";', '      window.AIVOAdFilmActiveOutputId=item.id;', '      if(window.AIVOAdFilmResultControls&&typeof window.AIVOAdFilmResultControls.mount==="function")window.AIVOAdFilmResultControls.mount(item.videoUrl,item.logoUrl||"",{projectId:source.id,outputId:item.id,version:item.version||1,posterUrl:item.posterUrl||"",play:!!play});']
          );
          replaceOnce(gallery,
            ['      window.AIVOAdFilmGeneratedVideo=active&&active.videoUrl||"";', '      window.AIVOAdFilmGeneratedLogo=active&&active.logoUrl||"";', '      window.AIVOAdFilmActiveOutputId=active&&active.id||"";', '      if(active&&window.AIVOAdFilmResultControls)window.AIVOAdFilmResultControls.mount(active.videoUrl,active.logoUrl||"",{projectId:next.id,outputId:active.id,version:active.version||1});'],
            ['      window.AIVOAdFilmGeneratedVideo=active&&active.videoUrl||"";', '      window.AIVOAdFilmGeneratedPoster=active&&active.posterUrl||"";', '      window.AIVOAdFilmGeneratedLogo=active&&active.logoUrl||"";', '      window.AIVOAdFilmActiveOutputId=active&&active.id||"";', '      if(active&&window.AIVOAdFilmResultControls)window.AIVOAdFilmResultControls.mount(active.videoUrl,active.logoUrl||"",{projectId:next.id,outputId:active.id,version:active.version||1,posterUrl:active.posterUrl||""});']
          );

          const controls = 'js/ad-film.result-controls.js';
          replaceOnce(controls,
            ['  if(window.__AIVO_AD_FILM_RESULT_CONTROLS_V11__)return;', '  window.__AIVO_AD_FILM_RESULT_CONTROLS_V11__=true;'],
            ['  if(window.__AIVO_AD_FILM_RESULT_CONTROLS_V12__)return;', '  window.__AIVO_AD_FILM_RESULT_CONTROLS_V12__=true;']
          );
          replaceOnce(controls,
            ['        videoUrl:source.generation.videoUrl,', '        sourceVideoUrl:source.generation.sourceVideoUrl||"",'],
            ['        videoUrl:source.generation.videoUrl,', '        posterUrl:source.generation.posterUrl||"",', '        sourceVideoUrl:source.generation.sourceVideoUrl||"",']
          );
          replaceOnce(controls,
            ['      url:clean(item.videoUrl),', '      logo:clean(item.logoUrl||source.media&&source.media.logo&&source.media.logo.url||source.generation&&source.generation.logoUrl||""),'],
            ['      url:clean(item.videoUrl),', '      poster:clean(item.posterUrl||source.generation&&source.generation.posterUrl||""),', '      logo:clean(item.logoUrl||source.media&&source.media.logo&&source.media.logo.url||source.generation&&source.generation.logoUrl||""),']
          );
          replaceOnce(controls,
            ['      url:clean(url),', '      logo:clean(logo),'],
            ['      url:clean(url),', '      poster:clean(options.posterUrl||item&&item.posterUrl||source.generation&&source.generation.posterUrl||window.AIVOAdFilmGeneratedPoster),', '      logo:clean(logo),']
          );
          replaceOnce(controls,
            ['      stableMediaKey(context.url),', '      context.logoApplied===true?"applied":stableMediaKey(context.logo)'],
            ['      stableMediaKey(context.url),', '      stableMediaKey(context.poster),', '      context.logoApplied===true?"applied":stableMediaKey(context.logo)']
          );
          replaceOnce(controls,
            ['      url:clean(context.url),', '      logo:clean(context.logo),'],
            ['      url:clean(context.url),', '      poster:clean(context.poster),', '      logo:clean(context.logo),']
          );
          replaceOnce(controls,
            ['    window.AIVOAdFilmGeneratedVideo=previewContext.url;', '    window.AIVOAdFilmGeneratedLogo=previewContext.logo;'],
            ['    window.AIVOAdFilmGeneratedVideo=previewContext.url;', '    window.AIVOAdFilmGeneratedPoster=previewContext.poster;', '    window.AIVOAdFilmGeneratedLogo=previewContext.logo;']
          );
          replaceOnce(controls,
            ['  function currentVideoUrl(){var context=currentContext();return clean(context&&context.url)}', '  function currentLogoUrl(){var context=currentContext();return clean(context&&context.logo)}'],
            ['  function currentVideoUrl(){var context=currentContext();return clean(context&&context.url)}', '  function currentPosterUrl(){var context=currentContext();return clean(context&&context.poster)}', '  function currentLogoUrl(){var context=currentContext();return clean(context&&context.logo)}']
          );
          replaceOnce(controls,
            ['      window.AIVOAdFilmGeneratedVideo="";', '      window.AIVOAdFilmGeneratedLogo="";'],
            ['      window.AIVOAdFilmGeneratedVideo="";', '      window.AIVOAdFilmGeneratedPoster="";', '      window.AIVOAdFilmGeneratedLogo="";']
          );
          replaceOnce(controls,
            ['    video.preload="metadata";', '    video.autoplay=false;'],
            ['    video.preload="metadata";', '    if(clean(context&&context.poster))video.poster=context.poster;else video.removeAttribute("poster");', '    video.autoplay=false;']
          );
          replaceOnce(controls,
            ['    var mediaChanged=!currentMediaKey||currentMediaKey!==desiredMediaKey;', '    if(mediaChanged){'],
            ['    var mediaChanged=!currentMediaKey||currentMediaKey!==desiredMediaKey;', '    if(clean(context.poster))video.poster=context.poster;else video.removeAttribute("poster");', '    if(mediaChanged){']
          );
          replaceOnce(controls,
            ['    videoUrl:currentVideoUrl,', '    logoUrl:currentLogoUrl,'],
            ['    videoUrl:currentVideoUrl,', '    posterUrl:currentPosterUrl,', '    logoUrl:currentLogoUrl,']
          );
          NODE

      - name: Check JavaScript syntax
        run: |
          node --check api/ad-film/seedance/finalize-v2.js
          node --check js/ad-film.output-gallery.js
          node --check js/ad-film.result-controls.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ad-film/seedance/finalize-v2.js js/ad-film.output-gallery.js js/ad-film.result-controls.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Add persistent poster frames for future ad films"
          git push origin HEAD:fix/adfilm-future-poster-frames
