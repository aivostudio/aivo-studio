<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title data-i18n="forgot.seoTitle">
    AIVO — Şifremi Unuttum
  </title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          720px 480px at 15% 80%,
          rgba(236,72,153,.10),
          transparent 65%
        ),
        radial-gradient(
          760px 500px at 88% 20%,
          rgba(37,99,235,.14),
          transparent 65%
        ),
        #070a16;
      color:#e9eefc;
    }

    .language-wrap{
      position:fixed;
      top:22px;
      right:22px;
      z-index:10;
    }

    .language-switch{
      display:inline-flex;
      align-items:center;
      gap:3px;
      padding:3px;
      border:1px solid rgba(160,120,255,.34);
      border-radius:999px;
      background:rgba(10,14,26,.68);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:
        0 10px 28px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .language-button{
      min-width:38px;
      height:32px;
      padding:0 10px;
      border:1px solid transparent;
      border-radius:999px;
      background:transparent;
      color:rgba(255,255,255,.66);
      font:inherit;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }

    .language-button:hover{
      color:#fff;
      background:rgba(255,255,255,.07);
    }

    .language-button.is-active{
      color:#fff;
      border-color:rgba(170,135,255,.55);
      background:linear-gradient(
        135deg,
        rgba(124,58,237,.62),
        rgba(59,130,246,.42)
      );
      box-shadow:
        0 6px 18px rgba(99,102,241,.20),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:86px 24px 32px;
    }

    .card{
      width:100%;
      max-width:520px;
      padding:28px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:24px;
      background:
        linear-gradient(
          145deg,
          rgba(34,30,70,.82),
          rgba(10,14,31,.92)
        );
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .brand{
      margin-bottom:24px;
      font-size:18px;
      font-weight:900;
      letter-spacing:.4px;
      color:#fff;
    }

    h1{
      margin:0 0 10px;
      font-size:30px;
      line-height:1.1;
    }

    p{
      margin:0 0 22px;
      opacity:.76;
      line-height:1.55;
    }

    label{
      display:block;
      margin:12px 0 8px;
      font-size:14px;
      font-weight:750;
    }

    input{
      width:100%;
      padding:14px 15px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      outline:none;
      background:rgba(0,0,0,.24);
      color:#fff;
      font:inherit;
    }

    input:focus{
      border-color:rgba(129,140,248,.78);
      box-shadow:0 0 0 3px rgba(99,102,241,.15);
    }

    .submit-button{
      width:100%;
      margin-top:16px;
      padding:14px 16px;
      border:0;
      border-radius:14px;
      background:linear-gradient(
        135deg,
        #8b5cf6,
        #3b82f6
      );
      color:#fff;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(79,70,229,.24);
    }

    .submit-button[disabled]{
      opacity:.55;
      cursor:not-allowed;
    }

    .msg{
      display:none;
      margin-top:16px;
      padding:13px 14px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:13px;
      background:rgba(255,255,255,.06);
      line-height:1.45;
    }

    .msg.show{
      display:block;
    }

    .small{
      margin-top:12px;
      font-size:12px;
      opacity:.8;
    }

    .debug{
      display:none;
      margin-top:12px;
    }

    .debug.show{
      display:block;
    }

    .debug a{
      color:#93c5fd;
      word-break:break-all;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:14px;
      margin-top:20px;
    }

    .link{
      color:#a5b4fc;
      text-decoration:none;
      font-size:14px;
      font-weight:700;
    }

    .link:hover{
      color:#fff;
    }

    @media (max-width:600px){
      .language-wrap{
        top:14px;
        right:14px;
      }

      .wrap{
        padding:
          74px
          14px
          24px;
      }

      .card{
        padding:22px;
        border-radius:20px;
      }

      h1{
        font-size:26px;
      }
    }
  </style>

  <script
    src="/js/desktop.i18n.js?v=4"
    defer
  ></script>
</head>

<body>

  <div class="language-wrap">
    <div
      class="language-switch"
      role="group"
      aria-label="Dil seçimi"
      data-i18n-label="forgot.languageLabel"
    >
      <button
        type="button"
        class="language-button"
        data-aivo-language="tr"
        aria-pressed="false"
      >
        TR
      </button>

      <button
        type="button"
        class="language-button"
        data-aivo-language="en"
        aria-pressed="false"
      >
        EN
      </button>
    </div>
  </div>

  <main class="wrap">
    <section class="card">

      <div class="brand">
        AIVO Studio
      </div>

      <h1 data-i18n="forgot.title">
        Şifremi Unuttum
      </h1>

      <p data-i18n="forgot.description">
        E-posta adresini gir. Eğer sistemde kayıtlıysa şifre sıfırlama bağlantısı gönderilecektir.
      </p>

      <label
        for="email"
        data-i18n="forgot.emailLabel"
      >
        E-posta
      </label>

      <input
        id="email"
        type="email"
        placeholder="ornek@site.com"
        data-i18n-placeholder="forgot.emailPlaceholder"
        autocomplete="email"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="email"
      />

      <button
        id="btn"
        class="submit-button"
        type="button"
        data-i18n="forgot.sendButton"
      >
        Şifre sıfırlama bağlantısı gönder
      </button>

      <div
        id="msg"
        class="msg"
        aria-live="polite"
      ></div>

      <div
        id="debug"
        class="debug small"
      >
        <div>
          <strong data-i18n="forgot.testMode">
            TEST MODU: E-posta yerine bağlantı burada gösterilir:
          </strong>
        </div>

        <div>
          <a
            id="debugLink"
            href="#"
            target="_blank"
            rel="noopener"
          >
            —
          </a>
        </div>
      </div>

      <div class="row">
        <a
          class="link"
          href="/index.html"
          data-i18n="forgot.backHome"
        >
          Ana sayfaya dön
        </a>

        <a
          class="link"
          href="/index.html"
          data-i18n="forgot.login"
        >
          Giriş Yap
        </a>
      </div>

    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const emailEl =
        document.getElementById("email");

      const btn =
        document.getElementById("btn");

      const msg =
        document.getElementById("msg");

      const debug =
        document.getElementById("debug");

      const debugLink =
        document.getElementById("debugLink");

      let currentMessageKey = "";

      function text(key, fallback) {
        try {
          if (typeof window.t === "function") {
            return window.t(key);
          }
        } catch (_) {}

        return fallback;
      }

      function setMsg(key, fallback) {
        currentMessageKey = key;

        msg.textContent =
          text(key, fallback);

        msg.classList.add("show");
      }

      function refreshDynamicText() {
        if (currentMessageKey) {
          msg.textContent =
            text(
              currentMessageKey,
              msg.textContent
            );
        }

        if (!btn.disabled) {
          btn.textContent =
            text(
              "forgot.sendButton",
              "Şifre sıfırlama bağlantısı gönder"
            );
        }
      }

      btn.addEventListener(
        "click",
        async function () {
          const email =
            String(emailEl.value || "")
              .trim();

          const validEmail =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/
              .test(email);

          if (!validEmail) {
            setMsg(
              "forgot.invalidEmail",
              "Lütfen geçerli bir e-posta adresi gir."
            );

            return;
          }

          btn.disabled = true;

          btn.textContent =
            text(
              "forgot.processing",
              "Gönderiliyor..."
            );

          msg.classList.remove("show");
          debug.classList.remove("show");
          currentMessageKey = "";

          try {
            const response =
              await fetch(
                "/api/auth/forgot",
                {
                  method: "POST",
                  headers: {
                    "Content-Type":
                      "application/json"
                  },
                body: JSON.stringify({
           email: email,

          lang:
        String(
      window.AIVO_LANG ||
      document.documentElement.getAttribute("lang") ||
      "tr"
    )
      .trim()
      .toLowerCase()
      .startsWith("en")
        ? "en"
        : "tr"
     })
                }
              );

            const data =
              await response
                .json()
                .catch(function () {
                  return {};
                });

            /*
              Kullanıcı hesabı sorgulamasını
              dışarıya belli etmemek için,
              API sonucundan bağımsız olarak
              aynı güvenli mesaj gösterilir.
            */
            setMsg(
              "forgot.success",
              "E-posta adresi sistemde kayıtlıysa sıfırlama bağlantısı gönderildi."
            );

            if (
              data &&
              data.debug_reset_url
            ) {
              debugLink.href =
                data.debug_reset_url;

              debugLink.textContent =
                data.debug_reset_url;

              debug.classList.add("show");

              console.log(
                "TEST RESET URL:",
                data.debug_reset_url
              );
            }
          } catch (error) {
            console.error(
              "AIVO_FORGOT_PASSWORD_ERROR:",
              error
            );

            setMsg(
              "forgot.error",
              "Bir hata oluştu. Lütfen tekrar dene."
            );
          } finally {
            btn.disabled = false;

            btn.textContent =
              text(
                "forgot.sendButton",
                "Şifre sıfırlama bağlantısı gönder"
              );
          }
        }
      );

      emailEl.addEventListener(
        "keydown",
        function (event) {
          if (event.key !== "Enter") {
            return;
          }

          event.preventDefault();
          btn.click();
        }
      );

      document.addEventListener(
        "aivo:language-change",
        refreshDynamicText
      );
    })();
  </script>

</body>
</html>
