  <style id="aivo-auth-gate-style">html{visibility:hidden;}</style>
  <script>
  (function AIVO_STUDIO_HARD_GATE(){
    "use strict";
    if(window.__AIVO_STUDIO_HARD_GATE__)return;
    window.__AIVO_STUDIO_HARD_GATE__=true;
    function goIndexLogin(){location.replace("/?open=login&from="+encodeURIComponent(location.href));}
    var controller=new AbortController();
    var timeout=setTimeout(function(){try{controller.abort()}catch(_){}},2500);
    fetch("/api/auth/me",{credentials:"include",cache:"no-store",signal:controller.signal})
      .then(async function(response){
        clearTimeout(timeout);
        if(response.status===200){
          var me=await response.json();
          try{
            var nextEmail=String(me&&me.email||"").trim().toLowerCase();
            var firstName=String(me&&me.first_name||me&&me.firstName||me&&me.name||nextEmail.split("@")[0]||"Kullanıcı").trim();
            var surname=String(me&&me.last_name||me&&me.lastName||me&&me.surname||"").trim();
            localStorage.setItem("aivo_logged_in","1");
            localStorage.setItem("aivo_user_email",nextEmail);
            localStorage.setItem("aivo_auth_unified_v1",JSON.stringify({loggedIn:true,email:nextEmail,name:firstName,first_name:firstName,surname:surname,last_name:surname,full_name:(firstName+" "+surname).trim(),ts:Date.now()}));
          }catch(_){}
          var gateStyle=document.getElementById("aivo-auth-gate-style");if(gateStyle)gateStyle.remove();
          document.documentElement.style.visibility="visible";
          try{document.dispatchEvent(new CustomEvent("aivo:auth-ready",{detail:{me:me}}))}catch(_){}
          if(me&&me.email){
            fetch("/api/presence/ping",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:me.email})});
            setInterval(function(){fetch("/api/presence/ping",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:me.email})})},30000);
          }
          return;
        }
        goIndexLogin();
      })
      .catch(goIndexLogin);
  })();
  </script>
