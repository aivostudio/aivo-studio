<!-- FILE: modules/cover.html -->
<section
  class="main-panel"
  data-module="cover"
>
  <!-- ================= COVER MODULE ================= -->

  <div
    class="cover-view is-active"
    data-cover-view="root"
  >
    <!-- HERO -->
    <div class="card page-hero-card has-gradient">
      <div class="page-hero-inner">
        <div
          class="page-title"
          data-i18n="studio.cover.title"
        >
          Kapak / Görsel Üret
        </div>

        <div
          class="page-subtitle"
          data-i18n="studio.cover.subtitle"
        >
          Spotify, Apple Music ve YouTube için kapaklarını AI ile tasarla.
        </div>
      </div>
    </div>

    <!-- GRID -->
    <div class="cover-grid">

      <!-- SOL: FORM -->
      <div class="card cover-left">

        <div class="card-header">
          <span
            class="badge-beta"
            data-i18n="studio.cover.beta"
          >
            BETA
          </span>
        </div>

        <div class="form-grid cover-form-grid">

          <!-- PROMPT -->
          <div class="form-field full">
            <label
              for="coverPrompt"
              data-i18n="studio.cover.prompt"
            >
              Prompt
            </label>

            <textarea
              id="coverPrompt"
              name="desktop_cover_prompt"
              rows="4"
              maxlength="1000"
              autocomplete="off"
              autocapitalize="sentences"
              autocorrect="off"
              spellcheck="true"
              placeholder="Prompt buraya yazılacak..."
              data-i18n-placeholder="studio.cover.promptPlaceholder"
            ></textarea>

            <div
              class="prompt-count"
              id="coverPromptCount"
            >
              0 / 1000
            </div>
          </div>
          <!-- /PROMPT -->

          <!-- KALİTE SEVİYESİ -->
          <div class="form-field full">
            <label data-i18n="studio.cover.qualityLevel">
              Kalite Seviyesi
            </label>

            <div
              class="quality-pills"
              role="radiogroup"
              aria-label="Kalite Seviyesi"
              data-i18n-label="studio.cover.qualityLevel"
            >
              <!-- ARTIST -->
              <button
                class="quality-pill is-active"
                type="button"
                data-quality="artist"
                data-credit-cost="6"
                data-model="fal-ai/flux-2-pro"
                aria-pressed="true"
              >
                <span class="qp-left">
                  <span
                    class="qp-ico"
                    aria-hidden="true"
                  >
                    🎨
                  </span>

                  <span
                    class="qp-title"
                    data-i18n="studio.cover.qualityArtist"
                  >
                    Artist
                  </span>
                </span>

                <span class="qp-right">
                  <span
                    class="qp-credit"
                    data-i18n="studio.cover.credit6"
                  >
                    6 Kredi
                  </span>
                </span>
              </button>

              <!-- CINEMATIC ULTRA HD -->
              <button
                class="quality-pill is-ultra"
                type="button"
                data-quality="ultra"
                data-credit-cost="9"
                data-model="fal-ai/flux-pro/v1.1-ultra"
                aria-pressed="false"
              >
                <span class="qp-left">
                  <span
                    class="qp-ico"
                    aria-hidden="true"
                  >
                    🚀
                  </span>

                  <span
                    class="qp-title"
                    data-i18n="studio.cover.qualityUltra"
                  >
                    Cinematic Ultra HD
                  </span>
                </span>

                <span class="qp-right">
                  <span
                    class="qp-credit"
                    data-i18n="studio.cover.credit9"
                  >
                    9 Kredi
                  </span>
                </span>
              </button>
            </div>
          </div>
          <!-- /KALİTE SEVİYESİ -->

          <!-- STİL KARTLARI -->
          <div class="form-field full">
            <label data-i18n="studio.cover.styleOptions">
              Stil Seçenekleri
            </label>

            <div class="cover-style-cards">

              <!-- GERÇEKÇİ -->
              <button
                class="style-card"
                type="button"
                data-style="Gerçekçi"
                data-prompt="Spotify albüm kapağı, gerçekçi portre, stüdyo ışığı, premium, keskin detay, 1:1"
                data-prompt-tr="Spotify albüm kapağı, gerçekçi portre, stüdyo ışığı, premium, keskin detay, 1:1"
                data-prompt-en="Spotify album cover, realistic portrait, studio lighting, premium, sharp detail, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  📸
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.styleRealistic"
                  >
                    Gerçekçi
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.styleRealisticSub"
                  >
                    Stüdyo ışığında net, doğal ve yüksek detaylı kapaklar
                  </span>
                </span>
              </button>

              <!-- SANATSAL -->
              <button
                class="style-card"
                type="button"
                data-style="Sanatsal"
                data-prompt="Sanatsal albüm kapağı, yağlı boya dokusu, dramatik ışık, derin renkler, 1:1"
                data-prompt-tr="Sanatsal albüm kapağı, yağlı boya dokusu, dramatik ışık, derin renkler, 1:1"
                data-prompt-en="Artistic album cover, oil paint texture, dramatic lighting, deep colors, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  🎨
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.styleArtistic"
                  >
                    Sanatsal
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.styleArtisticSub"
                  >
                    Doku, ışık ve derin renklerle “eser” hissi veren kompozisyonlar
                  </span>
                </span>
              </button>

              <!-- ÇİZGİ FİLM -->
              <button
                class="style-card"
                type="button"
                data-style="Çizgi Film"
                data-prompt="Çizgi film albüm kapağı, canlı renkler, kalın kontur, eğlenceli karakter stili, 1:1"
                data-prompt-tr="Çizgi film albüm kapağı, canlı renkler, kalın kontur, eğlenceli karakter stili, 1:1"
                data-prompt-en="Cartoon album cover, vivid colors, bold outlines, playful character style, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  🧸
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.styleCartoon"
                  >
                    Çizgi Film
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.styleCartoonSub"
                  >
                    Temiz hatlar, canlı tonlar ve karakter odaklı eğlenceli stil
                  </span>
                </span>
              </button>

              <!-- SOYUT -->
              <button
                class="style-card"
                type="button"
                data-style="Soyut"
                data-prompt="Soyut albüm kapağı, geometrik şekiller, yumuşak geçişler, modern tasarım, 1:1"
                data-prompt-tr="Soyut albüm kapağı, geometrik şekiller, yumuşak geçişler, modern tasarım, 1:1"
                data-prompt-en="Abstract album cover, geometric shapes, soft gradients, modern design, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  🫧
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.styleAbstract"
                  >
                    Soyut
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.styleAbstractSub"
                  >
                    Geometrik formlar ve yumuşak geçişlerle modern konsept tasarım
                  </span>
                </span>
              </button>

              <!-- FOTOĞRAFİK -->
              <button
                class="style-card"
                type="button"
                data-style="Fotoğrafik"
                data-prompt="Fotoğrafik albüm kapağı, sinematik ışık, alan derinliği, premium fotoğraf estetiği, 1:1"
                data-prompt-tr="Fotoğrafik albüm kapağı, sinematik ışık, alan derinliği, premium fotoğraf estetiği, 1:1"
                data-prompt-en="Photographic album cover, cinematic lighting, depth of field, premium photography aesthetic, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  📷
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.stylePhoto"
                  >
                    Fotoğrafik
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.stylePhotoSub"
                  >
                    Sinematik ışık, alan derinliği ve premium fotoğraf estetiği
                  </span>
                </span>
              </button>

              <!-- ANİME -->
              <button
                class="style-card"
                type="button"
                data-style="Anime"
                data-prompt="Anime albüm kapağı, japon manga stili, yumuşak ışık, temiz hatlar, 1:1"
                data-prompt-tr="Anime albüm kapağı, japon manga stili, yumuşak ışık, temiz hatlar, 1:1"
                data-prompt-en="Anime album cover, Japanese manga style, soft lighting, clean lines, 1:1"
                aria-pressed="false"
              >
                <span
                  class="style-card-ico"
                  aria-hidden="true"
                >
                  🌸
                </span>

                <span class="style-card-text">
                  <span
                    class="style-card-title"
                    data-i18n="studio.cover.styleAnime"
                  >
                    Anime
                  </span>

                  <span
                    class="style-card-sub"
                    data-i18n="studio.cover.styleAnimeSub"
                  >
                    Manga dokusu, yumuşak ışık ve temiz çizgilerle anime dili
                  </span>
                </span>
              </button>

            </div>
          </div>
          <!-- /STİL KARTLARI -->

          <!-- GÖRÜNTÜ SAYISI -->
          <div class="form-field">
            <label
              for="coverCount"
              data-i18n="studio.cover.imageCount"
            >
              Görüntü Sayısı
            </label>

            <select
              class="select"
              id="coverCount"
              name="desktop_cover_count"
              autocomplete="off"
            >
              <option
                value="1"
                data-i18n="studio.cover.image1"
              >
                1 Görüntü
              </option>

              <option
                value="2"
                data-i18n="studio.cover.image2"
              >
                2 Görüntü
              </option>

              <option
                value="4"
                data-i18n="studio.cover.image4"
              >
                4 Görüntü
              </option>
            </select>
          </div>
          <!-- /GÖRÜNTÜ SAYISI -->

          <!-- EN / BOY ORANI -->
          <div class="form-field">
            <label
              for="coverRatio"
              data-i18n="studio.cover.aspectRatio"
            >
              En / Boy Oranı
            </label>

            <select
              class="select"
              id="coverRatio"
              name="desktop_cover_ratio"
              autocomplete="off"
            >
              <option
                value="1:1"
                data-i18n="studio.cover.ratioSquare"
              >
                Kare (1:1)
              </option>

              <option
                value="9:16"
                data-i18n="studio.cover.ratioVertical"
              >
                Dikey (9:16)
              </option>

              <option
                value="16:9"
                data-i18n="studio.cover.ratioHorizontal"
              >
                Yatay (16:9)
              </option>
            </select>
          </div>
          <!-- /EN / BOY ORANI -->

          <!-- KAPAK MOTORU -->
          <div class="form-field full advanced-box">
            <div class="advanced-header">
              <span data-i18n="studio.cover.engineTitle">
                AIVO Kapak Motoru
              </span>

              <span class="advanced-credit">
                <span data-i18n="studio.cover.requiredCredit">
                  Gerekli Kredi:
                </span>

                <strong id="coverRequiredCredit">
                  6
                </strong>
              </span>
            </div>

            <p
              class="advanced-desc"
              data-i18n="studio.cover.engineDesc"
            >
              6 kredi ile 1 kapak üretilir. Kalite artırımı daha fazla kredi tüketebilir.
            </p>
          </div>
          <!-- /KAPAK MOTORU -->

          <!-- GENERATE -->
          <div class="form-field full">
            <button
              class="primary-btn full-width"
              id="coverGenerateBtn"
              type="button"
              data-generate="cover"
              data-credit-cost="6"
              data-i18n="studio.cover.generate6"
            >
              🖼️ Kapak Üret (6 Kredi)
            </button>
          </div>
          <!-- /GENERATE -->

        </div>
      </div>
      <!-- /SOL FORM -->

    </div>
    <!-- /GRID -->
  </div>

  <!-- ================= /COVER MODULE ================= -->
</section>
