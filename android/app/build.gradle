            def adfilmCompat = '''
<script>
(function AIVO_PLAY_ADFILM_COMPAT(){
  "use strict";
  if (window.__AIVO_PLAY_ADFILM_COMPAT__) return;
  window.__AIVO_PLAY_ADFILM_COMPAT__ = true;

  function markTiming(label, detail){
    try {
      if (window.__AIVO_PLAY_TIMING__ && typeof window.__AIVO_PLAY_TIMING__.mark === "function") {
        window.__AIVO_PLAY_TIMING__.mark(label, detail || null);
      }
    } catch (_) {}
  }

  function hideAdFilmForNavigation(event){
    const link = event.currentTarget;
    const href = String(link && link.getAttribute("href") || "").toLowerCase();
    if (href === "#productions") return;

    const mount = document.getElementById("mobileAdFilmMount");
    if (mount) mount.hidden = true;
  }

  let adFilmLibraryOpenPending = false;
  let adFilmProductionObserver = null;

  function ensureAdFilmProductionController(){
    if (typeof window.mobileAdFilmShowLibrary === "function") return true;

    const root = document.getElementById("mobileAdFilmSection");
    if (!root) return false;

    let script = document.querySelector('script[data-mobile-adfilm-production-controller]');
    if (script) return true;

    markTiming("PRODUCTION_EARLY_LOAD_START");

    script = document.createElement("script");
    script.src = "/mobile/js/mobile.adfilm.production.js?v=1";
    script.setAttribute("data-mobile-adfilm-production-controller", "");

    script.addEventListener("load", function(){
      script.dataset.loaded = "1";
      markTiming("MOBILE_ADFILM_SHOW_LIBRARY_READY", {
        type: typeof window.mobileAdFilmShowLibrary
      });
    }, { once:true });

    script.addEventListener("error", function(){
      markTiming("PRODUCTION_EARLY_LOAD_ERROR");
    }, { once:true });

    document.head.appendChild(script);
    return true;
  }

  function watchAdFilmProductionController(){
    if (ensureAdFilmProductionController()) return;

    const mount = document.getElementById("mobileAdFilmMount");
    if (!mount || adFilmProductionObserver) return;

    adFilmProductionObserver = new MutationObserver(function(){
      if (!ensureAdFilmProductionController()) return;
      adFilmProductionObserver.disconnect();
      adFilmProductionObserver = null;
    });

    adFilmProductionObserver.observe(mount, {
      childList: true,
      subtree: true
    });
  }
  function openAdFilmLibraryWhenReady(){
    if (adFilmLibraryOpenPending) return;
    adFilmLibraryOpenPending = true;
    ensureAdFilmProductionController();

    function open(){
      const mount = document.getElementById("mobileAdFilmMount");
      if (!mount || mount.hidden) {
        adFilmLibraryOpenPending = false;
        return;
      }

      if (typeof window.mobileAdFilmShowLibrary === "function") {
        adFilmLibraryOpenPending = false;
        window.mobileAdFilmShowLibrary();
        return;
      }

      window.setTimeout(open, 50);
    }

    open();
  }

  function guardAdFilmProductions(event){
    const productions = event.target && event.target.closest
      ? event.target.closest('.bottom-nav a[href="#productions"]')
      : null;

    if (!productions) return;

    const mount = document.getElementById("mobileAdFilmMount");
    if (!mount || mount.hidden) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    openAdFilmLibraryWhenReady();
  }

  function bindBottomNav(){
    document.querySelectorAll(".bottom-nav a").forEach(function(item){
      if (item.__aivoAdFilmCompatBound) return;
      item.__aivoAdFilmCompatBound = true;
      item.addEventListener("click", hideAdFilmForNavigation, true);
    });
  }

  function openHashRoute(){
    if (String(window.location.hash || "").toLowerCase() !== "#adfilm") return true;

    const card = document.querySelector('[data-mobile-tool="adfilm"]');
    if (!card) return false;

    card.click();
    watchAdFilmProductionController();
    return true;
  }

  function boot(){
    document.addEventListener("click", guardAdFilmProductions, true);
    bindBottomNav();
    watchAdFilmProductionController();

    if (openHashRoute()) return;

    let attempts = 0;
    const retry = window.setInterval(function(){
      attempts += 1;
      bindBottomNav();
      watchAdFilmProductionController();
      if (openHashRoute() || attempts >= 20) {
        window.clearInterval(retry);
      }
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
'''

