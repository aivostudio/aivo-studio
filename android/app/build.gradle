        def newRestore = '''  function restoreFromManifestOrProject(id, project){
    if (!id || restoring) return;

    const hasServerMedia = !!(
      project &&
      Object.prototype.hasOwnProperty.call(project, "media")
    );
    const media = hasServerMedia ? (project.media || {}) : null;
    const serverProducts = media && Array.isArray(media.productImages)
      ? media.productImages.slice(0, 9)
      : [];
    const serverLogo = media && media.logo ? media.logo : null;
    const serverSignature = hasServerMedia
      ? serverProducts.map(function(asset){ return clean(asset && asset.key); }).join("|") + "::" + clean(serverLogo && serverLogo.key)
      : "";
    const localSignature = orderedEntries().filter(function(entry){ return !!entry.remote; }).map(function(entry){ return clean(entry.remote && entry.remote.key); }).join("|") + "::" + clean(state.logo[0] && state.logo[0].remote && state.logo[0].remote.key);
    const hasPendingLocal = Object.keys(state).some(function(group){
      return state[group].some(function(entry){ return !!entry.file && !entry.remote; });
    });

    if (activeProjectId === id) {
      if (hasPendingLocal) return;
      if (hasServerMedia && serverSignature === localSignature) return;
      if (!hasServerMedia && referenceCount() + state.logo.length > 0) return;
    }

    restoring = true;
    clearState();
    activeProjectId = id;
    if (hasServerMedia) {
      if (serverProducts[0]) state.primary = [entryFromRemote(serverProducts[0], "primary", serverProducts[0].key)].filter(Boolean);
