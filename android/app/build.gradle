  function watchRadioArchive(){
    const finalCard = document.querySelector('#mobileAdFilmSection [data-mobile-adfilm-view="radio"] [data-mobile-radio-card="final"]');
    if (!finalCard) return;

    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver(function(entries){
        const visible = entries.some(function(entry){ return entry.isIntersecting; });
        if (!visible) return;
        observer.disconnect();
        loadRadioArchive();
      }, { root:null, rootMargin:"120px 0px" });
