<script>
(function AIVO_PLAY_TIMING_DIAGNOSTIC(){
  if (window.__AIVO_PLAY_TIMING_DIAGNOSTIC__) return;
  window.__AIVO_PLAY_TIMING_DIAGNOSTIC__ = true;

  const startedAt = performance.now();

  window.__AIVO_PLAY_TIMING__ = {
    startedAt: startedAt,
    events: [],
    mark: function(label, detail){
      const now = performance.now();
      const elapsed = now - startedAt;
      const event = {
        label: label,
        now: Number(now.toFixed(1)),
        elapsed: Number(elapsed.toFixed(1)),
        timestamp: Date.now(),
        detail: detail || null
      };

      this.events.push(event);

      console.log(
        "[AIVO_TIMING] " +
        label +
        " +" +
        elapsed.toFixed(1) +
        "ms @" +
        now.toFixed(1) +
        "ms",
        detail || ""
      );

      return event;
    }
  };

  window.__AIVO_PLAY_TIMING__.mark("STUDIO_BOOT_START");

  document.addEventListener("DOMContentLoaded", function(){
    window.__AIVO_PLAY_TIMING__.mark("DOM_CONTENT_LOADED");
  }, { once: true });
})();
</script>
'''

