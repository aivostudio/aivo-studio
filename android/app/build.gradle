apply plugin: 'com.android.application'

android {
    namespace = "tr.aivo.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "tr.aivo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.0.26"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file(
                System.getenv("AIVO_UPLOAD_STORE_FILE")
                    ?: "${System.getProperty('user.home')}/AIVO-Keys/aivo-upload-key.jks"
            )
            storePassword System.getenv("AIVO_UPLOAD_STORE_PASSWORD")
            keyAlias System.getenv("AIVO_UPLOAD_KEY_ALIAS") ?: "aivo"
            keyPassword System.getenv("AIVO_UPLOAD_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

