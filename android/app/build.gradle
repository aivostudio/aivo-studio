      serverProducts.slice(4, 9).forEach(function(asset){ const entry = entryFromRemote(asset, "scene", asset.key); if (entry) state.scene.push(entry); });
      if (serverLogo) state.logo = [entryFromRemote(serverLogo, "logo", serverLogo.key)].filter(Boolean);
      writeManifest();
    } else {
      const manifest = readManifest(id);
      if (manifest && manifest.groups) {
        Object.keys(state).forEach(function(group){
