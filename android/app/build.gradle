apply plugin: 'com.android.application'

android {
    namespace = "tr.aivo.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "tr.aivo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "1.0.25"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file(
                System.getenv("AIVO_UPLOAD_STORE_FILE")
                    ?: "${System.getProperty('user.home')}/AIVO-Keys/aivo-upload-key.jks"
            )
            storePassword System.getenv("AIVO_UPLOAD_STORE_PASSWORD")
            keyAlias System.getenv("AIVO_UPLOAD_KEY_ALIAS") ?: "aivo"
            keyPassword System.getenv("AIVO_UPLOAD_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def aivoRepoRoot = rootProject.projectDir.parentFile
def aivoGeneratedAssetsDir = file("${projectDir}/src/main/assets")
def aivoGeneratedPublicDir = file("${aivoGeneratedAssetsDir}/public")

tasks.register("syncAivoWebAssets", Sync) {
    into aivoGeneratedPublicDir

    from(aivoRepoRoot) {
        include "mobile/**"
        include "css/**"
        include "aivo-logo.png"
        include "apple-touch-icon.png"
        include "favicon.ico"
        include "forgot.play.html"
        include "index.play.html"
        include "login.play.html"
        include "studio.play.html"
    }

    from(aivoRepoRoot) {
        include "index.play.html"
        rename { "index.html" }
    }

    doLast {
        aivoGeneratedAssetsDir.mkdirs()
        new File(aivoGeneratedAssetsDir, "capacitor.config.json").text = '''{
  "appId": "tr.aivo.app",
  "appName": "AIVO Studio",
  "webDir": "www"
}
'''

        def generatedIndex = new File(aivoGeneratedPublicDir, "index.html")
        def generatedStudio = new File(aivoGeneratedPublicDir, "studio.play.html")

        if (!generatedIndex.exists()) {
            throw new GradleException("Generated index.html was not found after Android asset sync.")
        }

        if (!generatedStudio.exists()) {
            throw new GradleException("Generated studio.play.html was not found after Android asset sync.")
        }
    }
}

preBuild.dependsOn(tasks.named("syncAivoWebAssets"))

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    def billingVersion = "9.1.0"
    implementation "com.android.billingclient:billing:$billingVersion"

    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info(
        "google-services.json not found, google-services plugin not applied. Push Notifications won't work"
    )
}